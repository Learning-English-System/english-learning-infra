worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    limit_req_status 429;

    # Connection upgrade mapping for WebSockets (Vite HMR & SignalR)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Upstream backend microservices (host.docker.internal or container DNS)
    upstream auth_backend {
        server host.docker.internal:5001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream profile_backend {
        server host.docker.internal:5002 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream learning_backend {
        server host.docker.internal:5003 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream ai_backend {
        server host.docker.internal:5004 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream test_backend {
        server host.docker.internal:5005 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream frontend_backend {
        server host.docker.internal:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8080 default_server;
        server_name _;

        # Client body buffers & speech audio upload limits (up to 50MB)
        client_max_body_size 50M;
        client_body_buffer_size 1M;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;

        # Standard Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Gateway-Version "EnglishLearning-Gateway-v1.0" always;

        # Health probe endpoint
        location /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"Healthy","service":"API Gateway","gatewayPort":8080}\n';
        }

        # 1. Auth Service & OpenIddict endpoints
        location /api/auth/connect/ {
            limit_req zone=auth_limit burst=20 nodelay;

            proxy_pass http://auth_backend/connect/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Connection "";
        }

        location /api/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;

            proxy_pass http://auth_backend/api/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Connection "";
        }

        location /connect/ {
            limit_req zone=auth_limit burst=20 nodelay;

            proxy_pass http://auth_backend/connect/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Connection "";
        }

        location /.well-known/ {
            proxy_pass http://auth_backend/.well-known/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Connection "";
        }

        # 2. Profile Service
        location /api/profile/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://profile_backend/api/profile/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Connection "";
        }

        # 3. Learning & Vocabulary Service
        location /api/vocabulary/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://learning_backend/api/vocabulary/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Connection "";
        }

        # 4. AI Service (with audio file uploads for pronunciation)
        location /api/ai/ {
            limit_req zone=api_limit burst=30 nodelay;

            client_max_body_size 50M;
            proxy_pass http://ai_backend/api/ai/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Connection "";
        }

        # 5. Test Service
        location /api/tests/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://test_backend/api/tests/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Connection "";
        }

        # 6. Web Frontend & Static Assets (Fallback to React SPA / Vite dev server)
        location / {
            proxy_pass http://frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Vite HMR
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
